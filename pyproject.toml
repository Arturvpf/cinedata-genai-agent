[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinedata-genai-agent"
version = "0.1.0"
description = "Agente Text-to-SQL para o catálogo CineData Analytics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai==3.24.0",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx2==2.13.1"]

[tool.setuptools.packages.find]
where = ["src"]
