[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinedata-genai-agent"
version = "0.1.0"
description = "Agente Text-to-SQL para o catálogo CineData Analytics"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
